# OpenPI pi05 base + expert LoRA SFT. Global batch 256 / 8 GPUs = 32 per GPU.
backend: pi05
seed: 42
device: cuda
checkpoint: assets/openpi_pi05_base/model.safetensors
replay: data/online/replay
output: runs/sft
action_horizon: 50
execution_horizon: 10
action_dim: 32
robot_action_dim: 7
state_dim: 32
image_keys:
- base_0_rgb
- left_wrist_0_rgb
- right_wrist_0_rgb
max_token_len: 200
precision: bfloat16
gradient_checkpointing: true
critic_heads: 2
critic_hidden: 256
gamma: 0.99
target_retention: 0.995
td_samples: 1
margin: 0.1
rank_weight: 10.0
eta: 1.0
alpha_q: 1.0
bc_weight: 0.5
flow_steps: 10
cutoff: 0.5
cutoff_rule: ceil
apo_time_samples: 5
batch_size: 256
microbatch_size: 32
replay_mixture:
- 0.4
- 0.4
- 0.2
bc_correction_fraction: 0.5
critic_warmup_steps: 200
critic_steps_per_round: 198
actor_steps_per_round: 100
rounds: 100
sft_steps: 20000
critic_lr: 3.0e-05
actor_lr: 2.0e-05
sft_lr: 5.0e-05
critic_min_lr: 3.0e-06
actor_min_lr: 2.5e-06
critic_lr_warmup: 100
actor_lr_warmup: 1000
sft_lr_warmup: 10000
critic_schedule_steps: 20000
actor_schedule_steps: 10000
weight_decay: 1.0e-10
betas:
- 0.9
- 0.95
eps: 1.0e-08
grad_clip: null
critic_resnet_weights: assets/resnet10.safetensors
critic_visual_dim: 256
critic_proprio_dim: 64
critic_spatial_blocks: 8
actor_tuning: lora
lora_rank: 32
lora_alpha: 16.0
train_action_time_projections: true
replay_capacity: 100000
replay_cache_shards: 8
inactive_action_dims:
- 6
demonstrations: data/demonstrations/prepared
