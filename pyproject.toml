[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capo-pi05"
version = "0.1.0"
description = "CAPO with an OpenPI pi_05 backbone"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.7,<2.8", "numpy>=1.26,<2", "safetensors>=0.4", "Pillow>=11", "PyYAML>=6"]

[project.optional-dependencies]
data = ["pyarrow>=18", "av>=14"]
robot-client = ["msgpack>=1", "sentencepiece>=0.2"]
pi05 = ["transformers==4.53.2", "sentencepiece>=0.2", "flax==0.10.2", "jax==0.5.3", "jaxtyping==0.2.36", "beartype==0.19.0", "chex==0.1.90", "orbax-checkpoint==0.11.13", "augmax>=0.3.4", "einops>=0.8", "equinox>=0.11.8", "treescope>=0.1.7", "fsspec>=2024.6", "opencv-python>=4.10,<4.12", "websockets>=13", "msgpack>=1", "tyro>=0.9", "tqdm-loggable>=0.2", "numpydantic>=1.6", "ml-collections==1.0.0", "dm-tree>=0.1.8", "rich>=14", "etils[epath]>=1.9"]

[project.scripts]
capo-sft = "capo.sft:main"
capo-demos = "capo.demonstrations:main"
capo-reward = "capo.reward_train:main"
capo-online = "capo.online:main"
capo-train = "capo.train:main"
capo-collect = "capo.collect:main"
capo-serve = "capo.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"capo.robots" = ["THIRD_PARTY_LICENSE"]
